name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.lock

      - name: Lint code
        run: |
          python -m flake8 --ignore=E501,E266,W293 backend/src/

      - name: Type checking
        run: |
          python -m mypy backend/src/ --strict --ignore-missing-imports --show-error-codes --warn-unused-ignores

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.lock

      - name: Run tests
        run: |
          cd backend
          python -m unittest discover -s tests -p '*_test.py'

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.lock

      - name: Run tests with coverage
        run: |
          cd backend
          python -m coverage run -m unittest discover -s tests -p '*_test.py'
          python -m coverage report -m

      # Fail if coverage is below 80%
      - name: Check coverage
        run: |
          cd backend
          python -m coverage report --fail-under=80

  linux-source-archives:
    name: Reproducible Linux source archives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Build source and test archives
        run: make package-linux-source PYTHON=python

      - name: Upload source archives
        uses: actions/upload-artifact@v4
        with:
          name: advanced-task-manager-linux-source-${{ github.sha }}
          path: dist/linux-source/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  legacy-windows-build:
    name: Legacy Windows binary (not a release candidate)
    runs-on: windows-latest  # Changed from ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip install --disable-pip-version-check pyinstaller

      - name: Copy default config
        run: |
          cp requirements.txt backend/requirements.txt

      - name: Build with PyInstaller
        run: |
          cd backend
          pyinstaller backend.spec

      - uses: actions/upload-artifact@v4
        with:
          name: Task-Manager x64-windows
          path: backend/dist
